<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>千面画廊 · PRISM GALLERY</title>
<meta name="description" content="25 种风格的人像被棱镜撕成碎片、随机拼合成一张脸 —— 每一次重组都是全新的切法。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4 28 26 4 26Z' fill='none' stroke='%238a6bff' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ============================================================
   千面画廊 — PRISM GALLERY
   基调：纯黑展厅 + 光谱辉光碎片 + 衬线大标题 + 尘埃粒子
   概念：棱镜分光 = 风格光谱，25 块碎片各取一色
   ============================================================ */
:root{
  --bg:#050607;
  --ink:#e8ebee;
  --dim:#8b949c;
  --dim2:#5b646c;
  --hair:rgba(255,255,255,.09);
  --hair2:rgba(255,255,255,.16);
  --pill:rgba(12,15,19,.66);
  --violet:#8a6bff;
  --serif:"Georgia","Times New Roman","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue","Segoe UI",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
@media (pointer:fine){body,a,button,.shard{cursor:none}}

/* ---------- 背景层 ---------- */
#dust{position:fixed;inset:0;z-index:0;pointer-events:none}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.58) 100%)}

/* ---------- 自定义光标 ---------- */
#cursor{position:fixed;left:0;top:0;z-index:500;pointer-events:none;display:none}
@media (pointer:fine){#cursor{display:block}}
#cursor .c-dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#dfe5ea;left:-2px;top:-2px}
#cursor .c-ring{position:absolute;width:26px;height:26px;border-radius:50%;border:1px solid rgba(232,235,238,.5);
  left:-13px;top:-13px;transition:width .18s,height .18s,left .18s,top .18s,border-color .18s}
#cursor.hover .c-ring{width:42px;height:42px;left:-21px;top:-21px;border-color:hsla(262,100%,78%,.8)}

/* ---------- 顶栏 ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:62px;z-index:200;
  display:flex;align-items:center;padding:0 28px;gap:16px}
.logo{display:flex;align-items:center;gap:11px;white-space:nowrap}
.logo svg{width:19px;height:19px;flex:none}
.logo-cn{font-family:var(--serif);font-size:18px;letter-spacing:.14em;color:#eef1f4}
.logo-en{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--dim2);margin-top:3px}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.tb-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#c6cdd3;border:1px solid var(--hair);background:var(--pill);backdrop-filter:blur(8px);
  transition:transform .2s,border-color .2s,color .2s}
.tb-btn:hover{transform:scale(1.08);border-color:var(--hair2);color:#fff}
.tb-btn.active{color:var(--violet);border-color:hsla(258,100%,72%,.5)}
.tb-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb-div{width:1px;height:18px;background:var(--hair2);margin:0 4px}
.tb-link{font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--dim);
  padding:8px 4px;transition:color .25s}
.tb-link:hover{color:#e8ebee}

/* ---------- 舞台 ---------- */
#stage{position:relative;z-index:2;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:96px 20px 48px;gap:30px}
.head{text-align:center}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.42em;color:var(--dim2);margin-bottom:14px}
.title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,46px);
  letter-spacing:.22em;color:#f0f2f5;text-indent:.22em}
.title .sep{color:var(--violet);margin:0 .08em}
.sub{font-size:13px;color:var(--dim);letter-spacing:.12em;margin-top:14px;line-height:1.9}

/* ---------- 拼图 ---------- */
#mosaicWrap{position:relative;perspective:1300px}
.halo{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(130,96,255,.13),rgba(56,178,255,.055) 46%,transparent 70%);
  filter:blur(28px)}
#mosaic{position:relative;width:min(560px,86vw);aspect-ratio:1;z-index:1}
#mosaic::after{content:"";position:absolute;inset:0;background:rgba(4,5,8,.68);
  opacity:0;pointer-events:none;transition:opacity .32s ease;z-index:50}
#mosaic.hovering::after{opacity:1}

.shard{position:absolute;inset:0;z-index:1;opacity:0;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
  filter:drop-shadow(0 0 4px hsl(var(--h,220) 90% 62% / .3));
  transition:opacity .55s ease,
             clip-path .55s cubic-bezier(.6,0,.25,1),
             transform .32s ease,
             filter .32s ease}
.shard.nm{transition:opacity .55s ease,transform .32s ease,filter .32s ease}
.shard.on{opacity:1}
.shard:hover{z-index:60;transform:scale(1.045);
  filter:drop-shadow(0 0 13px hsl(var(--h,220) 95% 66% / .6)) brightness(1.07)}
.shard img{width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .6s ease}
.shard img.ld{opacity:1}
.ph{display:none;position:absolute;inset:0;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(135deg,hsl(var(--h,220) 52% 19% / .94),hsl(calc(var(--h,220) + 42) 52% 9% / .94))}
.shard.dead .ph{display:flex}
.ph span{font-family:var(--mono);font-size:30px;color:rgba(255,255,255,.3)}
.ph em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.32em;color:rgba(255,255,255,.16)}

/* ---------- 悬浮标签 ---------- */
#tag{position:fixed;left:0;top:0;z-index:150;pointer-events:none;white-space:nowrap;
  padding:5px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.26em;
  color:hsl(var(--h,220) 90% 72%);border:1px solid hsl(var(--h,220) 90% 60% / .45);
  background:rgba(8,10,14,.74);backdrop-filter:blur(6px);
  opacity:0;transform:translate(-50%,-180%) scale(.88);
  transition:opacity .2s ease,transform .2s ease}
#tag.show{opacity:1;transform:translate(-50%,-180%) scale(1)}

/* ---------- 底部提示 ---------- */
.hint{text-align:center;line-height:2.1}
.hint-line{font-size:12px;color:var(--dim);letter-spacing:.14em}
.hint-line.dim{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.22em}
.kbd{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;margin:0 2px;
  border:1px solid var(--hair);border-radius:4px;color:#aeb6bd;background:rgba(255,255,255,.03)}
#cutNo{color:#9a8cff}

/* ---------- 灯箱 ---------- */
#lightbox{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  visibility:hidden;opacity:0;transition:opacity .35s ease,visibility 0s .35s}
#lightbox.open{visibility:visible;opacity:1;transition:opacity .35s ease}
.lb-scrim{position:absolute;inset:0;background:rgba(3,4,7,.9);backdrop-filter:blur(10px)}
.lb-figure{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;
  transform:scale(.93);transition:transform .4s cubic-bezier(.2,.8,.25,1)}
#lightbox.open .lb-figure{transform:scale(1)}
.lb-imgbox{position:relative;height:min(62vh,620px);max-width:86vw;aspect-ratio:1;
  clip-path:polygon(2.5% 2.5%,97.5% 2.5%,97.5% 97.5%,2.5% 97.5%);
  filter:drop-shadow(0 0 24px hsl(var(--h,220) 90% 60% / .32));
  transition:clip-path .45s ease,filter .3s ease}
.lb-imgbox img{width:100%;height:100%;object-fit:cover;display:block}
.lb-imgbox .lb-ph{display:none;position:absolute;inset:0;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,hsl(var(--h,220) 50% 18%),hsl(calc(var(--h,220) + 42) 50% 8%))}
.lb-imgbox .lb-ph span{font-family:var(--mono);font-size:44px;color:rgba(255,255,255,.3)}
.lb-imgbox .lb-ph em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:rgba(255,255,255,.16)}
.lb-cap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.lb-style{font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:hsl(var(--h,220) 90% 72%)}
.lb-frac{font-family:var(--mono);font-size:11px;color:var(--dim2);letter-spacing:.2em}
.lb-link{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.1em;
  padding:7px 16px;border-radius:999px;color:#cfc6ff;
  border:1px solid hsl(258 100% 72% / .4);background:hsl(258 100% 72% / .08);
  transition:border-color .25s,background .25s}
.lb-link:hover{border-color:hsl(258 100% 72% / .8);background:hsl(258 100% 72% / .16)}
.lb-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:2;
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#c6cdd3;border:1px solid var(--hair);background:var(--pill);backdrop-filter:blur(8px);
  transition:transform .2s,border-color .2s,color .2s}
.lb-arrow:hover{transform:translateY(-50%) scale(1.1);border-color:var(--hair2);color:#fff}
.lb-arrow svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lb-prev{left:3.5vw}.lb-next{right:3.5vw}
.lb-close{position:fixed;top:22px;right:26px;z-index:2;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#c6cdd3;
  border:1px solid var(--hair);background:var(--pill);backdrop-filter:blur(8px);
  transition:transform .2s,border-color .2s,color .2s}
.lb-close:hover{transform:rotate(90deg);border-color:var(--hair2);color:#fff}
.lb-close svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
@media (max-width:640px){.lb-arrow{display:none}}

/* ---------- 加载层 ---------- */
#loader{position:fixed;inset:0;z-index:400;background:#050607;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .8s ease}
#loader.done{opacity:0;pointer-events:none}
.ld-prism .ray{animation:rayPulse 2.2s ease-in-out infinite}
.ld-prism .ray:nth-child(2){animation-delay:.15s}
.ld-prism .ray:nth-child(3){animation-delay:.3s}
.ld-prism .ray:nth-child(4){animation-delay:.45s}
.ld-prism .ray:nth-child(5){animation-delay:.6s}
@keyframes rayPulse{0%,100%{opacity:.35}50%{opacity:1}}
.ld-bar{width:232px;height:2px;background:rgba(255,255,255,.08);overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,#ff4d6d,#ffb84d,#4dff88,#4dd2ff,#8a6bff);
  transition:width .4s ease}
.ld-text{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:var(--dim2)}

/* ---------- 响应式 & 无障碍 ---------- */
@media (max-width:600px){
  #topbar{padding:0 18px}
  .logo-en{display:none}
  #stage{padding:88px 14px 36px;gap:24px}
  .sub{font-size:12px}
  .lb-imgbox{height:min(52vh,520px);max-width:88vw}
  .hint-line{font-size:11px;letter-spacing:.08em}
}
@media (prefers-reduced-motion:reduce){
  .shard,#mosaic::after,.lb-figure,.lb-imgbox,#tag{transition:none!important}
  .ld-prism .ray{animation:none}
}
</style>
</head>
<body>

<canvas id="dust"></canvas>
<div id="vignette"></div>

<header id="topbar">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none"><path d="M16 4 28 26 4 26Z" stroke="#8a6bff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 21h14" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/></svg>
    <span class="logo-cn">千面画廊</span>
    <span class="logo-en">PRISM&nbsp;GALLERY</span>
  </div>
  <div class="tb-actions">
    <button class="tb-btn" id="autoBtn" aria-label="自动放映" aria-pressed="false" title="自动放映">
      <svg viewBox="0 0 24 24" id="autoIcon"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="tb-btn" id="shuffleBtn" aria-label="重新拼合" title="重新拼合">
      <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
    </button>
    <span class="tb-div"></span>
    <a class="tb-link" href="/toys/">小玩意</a>
  </div>
</header>

<main id="stage">
  <header class="head">
    <p class="kicker">ONE FACE · TWENTY-FIVE MIRRORS</p>
    <h1 class="title">千面<span class="sep">·</span>画廊</h1>

    <div class="halo"></div>

  </div>

    <p class="hint-line dim">RECOMBINATION <span id="cutNo">#000</span> · 每次返回都会重新随机切割</p>
  </footer>
</main>

<div id="tag">STYLE 01</div>

<div id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lb-scrim"></div>
  <figure class="lb-figure">
    <div class="lb-imgbox" id="lbImgbox">
      <img id="lbImg" alt="">
      <div class="lb-ph" id="lbPh"><span>07</span><em>STYLE LOST</em></div>
    </div>
    <figcaption class="lb-cap">
      <span class="lb-style" id="lbStyle">STYLE 01</span>
      <span class="lb-frac" id="lbFrac">01 / 25</span>
      <a class="lb-link" id="lbLink" target="_blank" rel="noopener" style="display:none">阅读相关文章 →</a>
    </figcaption>
  </figure>
  <button class="lb-arrow lb-prev" id="lbPrev" aria-label="上一个风格">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="lb-arrow lb-next" id="lbNext" aria-label="下一个风格">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="lb-close" id="lbClose" aria-label="关闭">
    <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>
  </button>
</div>

<div id="loader">
  <svg class="ld-prism" width="130" height="86" viewBox="0 0 130 86" fill="none">
    <line x1="4" y1="43" x2="46" y2="43" stroke="rgba(255,255,255,.7)" stroke-width="1.4"/>
    <path d="M64 13 104 73H24Z" stroke="rgba(255,255,255,.85)" stroke-width="1.5" stroke-linejoin="round"/>
    <line class="ray" x1="102" y1="48" x2="126" y2="40" stroke="#ff4d6d" stroke-width="1.4"/>
    <line class="ray" x1="103" y1="56" x2="127" y2="54" stroke="#ffb84d" stroke-width="1.4"/>
    <line class="ray" x1="103" y1="63" x2="126" y2="68" stroke="#4dff88" stroke-width="1.4"/>
    <line class="ray" x1="101" y1="70" x2="123" y2="82" stroke="#4dd2ff" stroke-width="1.4"/>
    <line class="ray" x1="99" y1="76" x2="118" y2="94" stroke="#8a6bff" stroke-width="1.4"/>
  </svg>
  <div class="ld-bar"><i id="ldFill"></i></div>
  <p class="ld-text" id="ldText">正在收集风格碎片 0 / 25</p>
</div>

<div id="cursor"><span class="c-dot"></span><span class="c-ring"></span></div>

<noscript><p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8b949c">千面画廊需要启用 JavaScript</p></noscript>

<script>
(function(){
'use strict';

/* ================= 基础配置 ================= */
var TOTAL = 25;
var FILE  = function(i){ return '2' + i + '.png'; };
var CDN = function(n){ return 'https://cdn.jsdelivr.net/gh/tripodxu/blog-picture-source@main/' + n; };
var RAW = function(n){ return 'https://raw.githubusercontent.com/tripodxu/blog-picture-source/main/' + n; };
/* 部分风格对应博客文章（abbrlink 永久链接） */
var BLOG = { 2: '/posts/d30a74bb.html' };
var HUE = function(i){ return Math.round(i / (TOTAL - 1) * 300); };  /* 红→紫光谱 */
var pad = function(n){ return String(n).padStart(2, '0'); };

var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
var finePointer  = matchMedia('(pointer: fine)').matches;

var $ = function(id){ return document.getElementById(id); };
var mosaic = $('mosaic'), loader = $('loader'), ldFill = $('ldFill'), ldText = $('ldText'),
    cutNo = $('cutNo'), tag = $('tag'), lightbox = $('lightbox'),
    lbImgbox = $('lbImgbox'), lbImg = $('lbImg'), lbPh = $('lbPh'),
    lbStyle = $('lbStyle'), lbFrac = $('lbFrac'), lbLink = $('lbLink');

var shards = [], imgs = [], failed = [];
var doneCount = 0, started = false, busy = false, cutCount = 0;
var lbOpen = false, lbIndex = 0;

/* ================= 尘埃粒子背景 ================= */
(function(){
  var cv = $('dust'), ctx = cv.getContext('2d'), P = [], N = 85, W, H;
  function resize(){
    var dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function seed(){
    P = [];
    for (var i = 0; i < N; i++) P.push({
      x: Math.random() * W, y: Math.random() * H,
      r: .4 + Math.random() * 1.3,
      vx: (Math.random() - .5) * .12, vy: (Math.random() - .5) * .1,
      h: Math.random() * 360, ph: Math.random() * Math.PI * 2,
      sp: .3 + Math.random() * .7
    });
  }
  function draw(t){
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++){
      var p = P[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < -4) p.x = W + 4; if (p.x > W + 4) p.x = -4;
      if (p.y < -4) p.y = H + 4; if (p.y > H + 4) p.y = -4;
      var a = (Math.sin(t * .001 * p.sp + p.ph) * .5 + .5) * .34 + .05;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.h + ',70%,72%,' + a + ')';
      ctx.fill();
    }
  }
  function loop(t){
    if (!document.hidden) draw(t);
    requestAnimationFrame(loop);
  }
  resize(); seed();
  addEventListener('resize', function(){ resize(); seed(); });
  if (reduceMotion) draw(0); else requestAnimationFrame(loop);
})();

/* ================= 自定义光标 ================= */
(function(){
  if (!finePointer) return;
  var cur = $('cursor'), x = -100, y = -100, rx = -100, ry = -100;
  addEventListener('mousemove', function(e){ x = e.clientX; y = e.clientY; });
  document.addEventListener('mouseover', function(e){
    cur.classList.toggle('hover', !!e.target.closest('a,button,.shard'));
  });
  (function loop(){
    rx += (x - rx) * .18; ry += (y - ry) * .18;
    cur.style.transform = 'translate(' + rx + 'px,' + ry + 'px)';
    requestAnimationFrame(loop);
  })();
})();

/* ================= 固定点数锯齿区域生成 =================
   每条边固定 SEGS 段 → 每个多边形恒定 4*SEGS+1 个顶点，
   clip-path 得以在两次分割之间平滑 morph */
var SEGS = 6;
var clamp = function(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); };
var fmt = function(v){ return clamp(v, 0, 100).toFixed(2); };

function jaggedEdge(sx, sy, ex, ey){
  var pts = [], dx = ex - sx, dy = ey - sy,
      len = Math.sqrt(dx * dx + dy * dy) || 1,
      px = -dy / len, py = dx / len;
  for (var i = 0; i <= SEGS; i++){
    var t = i / SEGS, x = sx + dx * t, y = sy + dy * t;
    if (i > 0 && i < SEGS){
      var off = (Math.random() - .5) * Math.min(len * .05, 1.35);
      x += px * off; y += py * off;
    }
    pts.push([x, y]);
  }
  return pts;
}

function generateRegions(){
  var rows = Math.ceil(Math.sqrt(TOTAL)), cols = Math.ceil(TOTAL / rows);
  while (rows * cols - TOTAL > rows && rows > 1){ rows--; cols = Math.ceil(TOTAL / rows); }

  var vl = [], hl = [], i, r, c;
  for (i = 0; i <= cols; i++)
    vl.push((i === 0 || i === cols) ? i / cols * 100 : i / cols * 100 + (Math.random() - .5) * 5);
  for (i = 0; i <= rows; i++)
    hl.push((i === 0 || i === rows) ? i / rows * 100 : i / rows * 100 + (Math.random() - .5) * 5);

  var regions = [];
  for (r = 0; r < rows && regions.length < TOTAL; r++){
    for (c = 0; c < cols && regions.length < TOTAL; c++){
      var L = vl[c], R = vl[c + 1], T = hl[r], B = hl[r + 1];
      var j = function(){ return (Math.random() - .5) * 1.6; };
      var corners = [
        [clamp(L + j(), L - 1, L + 1), clamp(T + j(), T - 1, T + 1)],
        [clamp(R + j(), R - 1, R + 1), clamp(T + j(), T - 1, T + 1)],
        [clamp(R + j(), R - 1, R + 1), clamp(B + j(), B - 1, B + 1)],
        [clamp(L + j(), L - 1, L + 1), clamp(B + j(), B - 1, B + 1)]
      ];
      var pts = [];
      for (var e = 0; e < 4; e++){
        var s = corners[e], t = corners[(e + 1) % 4];
        var ep = jaggedEdge(s[0], s[1], t[0], t[1]);
        for (var k = 0; k < ep.length; k++){
          if (e > 0 && k === 0) continue; /* 起点与上一边终点重合 */
          pts.push(fmt(ep[k][0]) + '% ' + fmt(ep[k][1]) + '%');
        }
      }
      regions.push('polygon(' + pts.join(', ') + ')');
    }
  }
  /* 打乱 碎片↔区域 的对应关系 */
  for (i = regions.length - 1; i > 0; i--){
    var jx = Math.floor(Math.random() * (i + 1));
    var tmp = regions[i]; regions[i] = regions[jx]; regions[jx] = tmp;
  }
  return regions;
}

function applySplit(instant){
  var regions = generateRegions(), i;
  if (instant) for (i = 0; i < shards.length; i++) shards[i].classList.add('nm');
  for (i = 0; i < shards.length; i++) shards[i].style.clipPath = regions[i];
  if (instant){
    void mosaic.offsetHeight; /* 强制 reflow，让首次切割瞬时生效 */
    for (i = 0; i < shards.length; i++) shards[i].classList.remove('nm');
  }
  cutCount++;
  cutNo.textContent = '#' + String(cutCount).padStart(3, '0');
}

/* ================= 碎片构建与图片加载（双 CDN 回退） ================= */
function settle(){
  doneCount++;
  var pct = Math.round(doneCount / TOTAL * 100);
  ldFill.style.width = pct + '%';
  ldText.textContent = '正在收集风格碎片 ' + doneCount + ' / ' + TOTAL;
  if (doneCount >= TOTAL && !started) start();
}

for (var si = 0; si < TOTAL; si++){
  (function(i){
    var shard = document.createElement('div');
    shard.className = 'shard';
    shard.style.setProperty('--h', HUE(i));
    var img = document.createElement('img');
    img.alt = '风格 ' + (i + 1);
    img.decoding = 'async';
    var ph = document.createElement('div');
    ph.className = 'ph';
    ph.innerHTML = '<span>' + pad(i + 1) + '</span><em>STYLE LOST</em>';
    shard.appendChild(img); shard.appendChild(ph);
    mosaic.appendChild(shard);
    shards.push(shard); imgs.push(img); failed.push(false);

    var tried = false;
    img.addEventListener('load', function(){ img.classList.add('ld'); settle(); });
    img.addEventListener('error', function(){
      if (!tried){ tried = true; img.src = RAW(FILE(i)); }        /* 回退 raw 源 */
      else { failed[i] = true; shard.classList.add('dead'); img.remove(); settle(); }
    });
    img.src = CDN(FILE(i));

    shard.addEventListener('click', function(){ openLb(i); });

    if (finePointer){
      shard.addEventListener('mouseenter', function(e){
        mosaic.classList.add('hovering');
        tag.textContent = 'STYLE ' + pad(i + 1);
        tag.style.setProperty('--h', HUE(i));
        tag.classList.add('show');
        moveTag(e);
      });
      shard.addEventListener('mousemove', moveTag);
      shard.addEventListener('mouseleave', function(){
        mosaic.classList.remove('hovering');
        tag.classList.remove('show');
      });
    }
  })(si);
}

function moveTag(e){
  tag.style.left = e.clientX + 'px';
  tag.style.top = e.clientY + 'px';
}

/* 8 秒兜底：无论加载完成与否，拼图开张 */
setTimeout(function(){ if (!started) start(); }, 8000);

/* ================= 开场：碎片飞入拼合 ================= */
function start(){
  if (started) return;
  started = true;
  applySplit(true);
  loader.classList.add('done');
  setTimeout(function(){ loader.remove(); }, 900);

  shards.forEach(function(s, i){
    s.style.transitionDelay = (reduceMotion ? 0 : i * 26) + 'ms';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ s.classList.add('on'); }); });
    if (reduceMotion) return;
    var vis = failed[i] ? s.querySelector('.ph') : s.querySelector('img');
    if (!vis) return;
    var a = Math.random() * Math.PI * 2, d = 140 + Math.random() * 170;
    vis.animate([
      { transform: 'translate(' + Math.cos(a) * d + 'px,' + Math.sin(a) * d + 'px) rotate(' + (Math.random() - .5) * 50 + 'deg) scale(1.18)', opacity: 0 },
      { transform: 'none', opacity: 1 }
    ], { duration: 720 + Math.random() * 280, delay: 130 + i * 26,
         easing: 'cubic-bezier(.18,.7,.22,1)', fill: 'backwards' });
  });
  /* 入场结束后清掉逐片延迟，避免影响 hover 过渡 */
  setTimeout(function(){
    shards.forEach(function(s){ s.style.transitionDelay = '0ms'; });
  }, reduceMotion ? 60 : 2000);
}

/* ================= 重新拼合：炸开 → 换切法 → 重组 ================= */
function reshuffle(){
  if (busy || !started) return;
  busy = true;
  if (reduceMotion){ applySplit(true); busy = false; return; }

  shards.forEach(function(s, i){
    var vis = failed[i] ? s.querySelector('.ph') : s.querySelector('img');
    if (!vis) return;
    var a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 115;
    var scatter = 'translate(' + Math.cos(a) * d + 'px,' + Math.sin(a) * d + 'px) rotate(' + (Math.random() - .5) * 24 + 'deg)';
    var anim = vis.animate([
      { transform: 'none' },
      { transform: scatter, offset: .42 },
      { transform: 'none' }
    ], { duration: 950, delay: i * 6, easing: 'cubic-bezier(.45,.05,.55,.95)', fill: 'both' });
    anim.addEventListener('finish', function(){ anim.cancel(); }, { once: true });
  });

  setTimeout(function(){ applySplit(false); }, 400);   /* 散开至顶点时换新切法 */
  setTimeout(function(){ busy = false; }, 950 + TOTAL * 6 + 80);
}

$('shuffleBtn').addEventListener('click', reshuffle);

/* ================= 3D 视差倾斜 ================= */
if (finePointer && !reduceMotion){
  var tx = 0, ty = 0, rx = 0, ry = 0;
  addEventListener('mousemove', function(e){
    var nx = e.clientX / innerWidth * 2 - 1,
        ny = e.clientY / innerHeight * 2 - 1;
    ty = nx * 4.5; tx = ny * -3.5;
  });
  (function tiltLoop(){
    rx += (tx - rx) * .07; ry += (ty - ry) * .07;
    mosaic.style.transform = 'rotateX(' + rx.toFixed(3) + 'deg) rotateY(' + ry.toFixed(3) + 'deg)';
    requestAnimationFrame(tiltLoop);
  })();
}

/* ================= 灯箱 ================= */
function tornEdge(){
  /* 灯箱图片的撕纸边缘（每次打开随机） */
  var pts = [], e,
      cs = [[3,3],[97,3],[97,97],[3,97]];
  for (e = 0; e < 4; e++){
    var s = cs[e], t = cs[(e + 1) % 4],
        seg = 4, dx = t[0]-s[0], dy = t[1]-s[1],
        len = Math.sqrt(dx*dx + dy*dy) || 1,
        px = -dy/len, py = dx/len;
    for (var k = 0; k <= seg; k++){
      if (e > 0 && k === 0) continue;
      var tt = k / seg, x = s[0] + dx*tt, y = s[1] + dy*tt;
      if (k > 0 && k < seg){
        var off = (Math.random() - .5) * Math.min(len * .05, 1.6);
        x += px * off; y += py * off;
      }
      pts.push(fmt(x) + '% ' + fmt(y) + '%');
    }
  }
  return 'polygon(' + pts.join(', ') + ')';
}

function renderLb(){
  var i = lbIndex, h = HUE(i);
  lbImgbox.style.setProperty('--h', h);
  lbStyle.textContent = 'STYLE ' + pad(i + 1);
  lbStyle.style.setProperty('--h', h);
  lbFrac.textContent = pad(i + 1) + ' / ' + TOTAL;
  if (failed[i]){
    lbImg.style.display = 'none';
    lbPh.style.display = 'flex';
    lbPh.innerHTML = '<span>' + pad(i + 1) + '</span><em>STYLE LOST</em>';
  } else {
    lbImg.style.display = 'block';
    lbPh.style.display = 'none';
    lbImg.src = imgs[i].src;
    lbImg.alt = '风格 ' + (i + 1);
  }
  lbImgbox.style.clipPath = tornEdge();
  var link = BLOG[i];
  if (link){ lbLink.href = link; lbLink.style.display = 'inline-flex'; }
  else lbLink.style.display = 'none';
}

function openLb(i){
  lbIndex = i; lbOpen = true;
  renderLb();
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  tag.classList.remove('show');
  mosaic.classList.remove('hovering');
}

function closeLb(){
  if (!lbOpen) return;
  lbOpen = false;
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  reshuffle();  /* 返回混合态：重新随机切割 */
}

function stepLb(dir){
  lbIndex = (lbIndex + dir + TOTAL) % TOTAL;
  renderLb();
}

$('lbClose').addEventListener('click', closeLb);
$('lbPrev').addEventListener('click', function(){ stepLb(-1); });
$('lbNext').addEventListener('click', function(){ stepLb(1); });
lightbox.querySelector('.lb-scrim').addEventListener('click', closeLb);

addEventListener('keydown', function(e){
  if (!lbOpen) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') stepLb(-1);
  else if (e.key === 'ArrowRight') stepLb(1);
});

/* 移动端滑动切换 */
(function(){
  var sx = 0, sy = 0;
  lightbox.addEventListener('touchstart', function(e){
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  lightbox.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - sx,
        dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) stepLb(dx > 0 ? -1 : 1);
  }, { passive: true });
})();

/* ================= 自动放映 ================= */
var auto = false, autoTimer = null;
$('autoBtn').addEventListener('click', function(){
  auto = !auto;
  this.classList.toggle('active', auto);
  this.setAttribute('aria-pressed', String(auto));
  $('autoIcon').innerHTML = auto ? '<path d="M7 5v14M17 5v14"/>' : '<path d="M8 5v14l11-7z"/>';
  clearInterval(autoTimer);
  if (auto) autoTimer = setInterval(function(){
    if (!lbOpen && !document.hidden) reshuffle();
  }, 5000);
});

})();
</script>
